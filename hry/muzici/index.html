<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mužíčci — Herna davidpolesny.cz</title>
<meta name="description" content="Mužíčci — puzzle inspirované Lemmings. Přiřaď schopnosti, prokopej cestu a zachraň mužíčky.">
<meta name="theme-color" content="#0d0e10">
<link rel="canonical" href="https://games.davidpolesny.cz/hry/muzici/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="muzici.css?v=7">
</head>
<body>
<div class="card">

  <header class="game-head">
    <a class="back" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Katalog
    </a>
    <span class="game-title">Mužíčci</span>
  </header>

  <div class="stage">

    <div class="screen">
      <canvas id="screen" width="640" height="480" aria-label="Hrací plocha hry Mužíčci"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-title" data-overlay-title></div>
        <div class="overlay-sub" data-overlay-sub></div>
      </div>
    </div>

    <div class="side">

      <div class="stat">
        <span class="stat-label">ÚROVEŇ</span>
        <span class="stat-value is-small" id="level-name">1</span>
      </div>

      <div class="stat-row">
        <div class="stat is-compact">
          <span class="stat-label">ULOŽENO</span>
          <span class="stat-value is-small" id="saved">0/5</span>
        </div>
        <div class="stat is-compact">
          <span class="stat-label">ČAS</span>
          <span class="stat-value is-small" id="time">2:00</span>
        </div>
      </div>

      <div class="stat">
        <span class="stat-label">SKÓRE</span>
        <span class="stat-value" id="score">0</span>
      </div>

      <div class="stat">
        <span class="stat-label">TVŮJ REKORD</span>
        <span class="stat-value is-small" id="best">—</span>
      </div>

      <div class="skills" id="skills" role="toolbar" aria-label="Schopnosti">
        <button type="button" class="skill" data-skill="blocker" aria-pressed="false">
          <span class="skill-art" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="32" height="32" fill="none"><rect x="5" y="9" width="22" height="13" rx="2" fill="#E8B84A"/><rect x="7" y="11" width="18" height="9" rx="1" fill="#FFF1B8"/><text x="16" y="18" text-anchor="middle" font-size="6" font-family="IBM Plex Mono, monospace" font-weight="700" fill="#5A3A08">STOP</text><rect x="13" y="22" width="6" height="6" rx="1" fill="#3E5FA8"/><circle cx="16" cy="8" r="4" fill="#F3D0AE"/><ellipse cx="16" cy="5.2" rx="4.2" ry="2.6" fill="#3BB85A"/></svg>
          </span>
          <span class="skill-meta">
            <span class="skill-name">Blokér</span>
            <span class="skill-hint">stop / uvolnit</span>
            <span class="skill-count" data-count>0</span>
          </span>
        </button>
        <button type="button" class="skill" data-skill="builder" aria-pressed="false">
          <span class="skill-art" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="32" height="32" fill="none"><rect x="12" y="16" width="8" height="9" rx="1.5" fill="#3E5FA8"/><rect x="12" y="12" width="8" height="6" rx="1.5" fill="#F3EEE4"/><circle cx="16" cy="9" r="4" fill="#F3D0AE"/><ellipse cx="16" cy="6.2" rx="4.2" ry="2.4" fill="#3BB85A"/><rect x="12" y="3.5" width="8" height="3" rx="1" fill="#E8A030"/><rect x="21" y="14" width="7" height="3.5" rx="0.8" fill="#C47840"/></svg>
          </span>
          <span class="skill-meta">
            <span class="skill-name">Stavař</span>
            <span class="skill-hint">staví schody</span>
            <span class="skill-count" data-count>0</span>
          </span>
        </button>
        <button type="button" class="skill" data-skill="digger" aria-pressed="false">
          <span class="skill-art" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="32" height="32" fill="none"><rect x="12" y="16" width="8" height="9" rx="1.5" fill="#3E5FA8"/><rect x="12" y="12" width="8" height="6" rx="1.5" fill="#F3EEE4"/><circle cx="16" cy="9" r="4" fill="#F3D0AE"/><rect x="12" y="3.8" width="8" height="3.2" rx="1" fill="#C45C2A"/><rect x="22" y="12" width="1.6" height="10" rx="0.6" fill="#9A9A9A"/><rect x="20" y="21" width="6" height="2.6" rx="0.6" fill="#D4D4D4"/></svg>
          </span>
          <span class="skill-meta">
            <span class="skill-name">Kopač</span>
            <span class="skill-hint">kopá dolů</span>
            <span class="skill-count" data-count>0</span>
          </span>
        </button>
        <button type="button" class="skill" data-skill="basher" aria-pressed="false">
          <span class="skill-art" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="32" height="32" fill="none"><rect x="12" y="16" width="8" height="9" rx="1.5" fill="#3E5FA8"/><rect x="12" y="12" width="8" height="6" rx="1.5" fill="#F3EEE4"/><circle cx="16" cy="9" r="4" fill="#F3D0AE"/><rect x="12" y="4" width="8" height="2.8" rx="1" fill="#4A9AD8"/><rect x="21" y="14" width="8" height="1.6" rx="0.6" fill="#A8B0B8"/><rect x="27" y="11" width="2.4" height="7.5" rx="0.6" fill="#E8ECF0"/></svg>
          </span>
          <span class="skill-meta">
            <span class="skill-name">Razíc</span>
            <span class="skill-hint">razí bokem</span>
            <span class="skill-count" data-count>0</span>
          </span>
        </button>
      </div>

      <div class="keys">
        <span class="stat-label">OVLÁDÁNÍ</span>
        <div class="keys-list">
          <span class="keys-row"><span>Schopnost</span><b>1–4 / KLIK</b></span>
          <span class="keys-row"><span>Přiřadit</span><b>KLIK NA MUŽÍČKA</b></span>
          <span class="keys-row"><span>Rychlost</span><b>F</b></span>
          <span class="keys-row"><span>Pauza</span><b>MEZERNÍK</b></span>
          <span class="keys-row"><span>Znovu</span><b>R</b></span>
        </div>
      </div>

      <div class="side-actions">
        <button class="btn btn-solid" type="button" id="btn-new">Nová hra</button>
        <button class="btn" type="button" id="btn-speed">Rychlost 1×</button>
        <a class="btn btn-quiet" href="/hry/had/">Had ↗</a>
      </div>

    </div>
  </div>

  <footer class="foot">
    <span>© 2026 David Polesný · NoReason s.r.o.</span>
    <span>Rekord se ukládá jen ve tvém prohlížeči.</span>
  </footer>

</div>

<script src="/assets/arcade.js"></script>
<script src="levels.js?v=27"></script>
<script src="muzici.js?v=27"></script>
</body>
</html>
